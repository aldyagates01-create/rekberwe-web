server {
    listen 80;
    listen [::]:80;
    server_name rekberwe.id www.rekberwe.id;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rekberwe-acme;
        default_type text/plain;
    }
    location / { return 301 https://rekberwe.id$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rekberwe.id www.rekberwe.id;
    ssl_certificate /etc/letsencrypt/live/rekberwe.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rekberwe.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-RekberWE-Origin vps always;
    if ($host = www.rekberwe.id) { return 301 https://rekberwe.id$request_uri; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/rekberwe-acme;
        default_type text/plain;
    }
    client_max_body_size 50m;
    location ^~ /data/ { return 404; }
    location ^~ /server/ { return 404; }
    location ^~ /node_modules/ { return 404; }
    location ~ /\.(?!well-known) { return 404; }
    access_log /var/log/nginx/rekberwe-access.log;
    error_log /var/log/nginx/rekberwe-error.log;
    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}


